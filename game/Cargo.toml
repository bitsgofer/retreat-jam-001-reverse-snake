[package]
name    = "reverse-snake"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
bevy       = { workspace = true }
ron        = "0.12"
serde      = { version = "1", features = ["derive"] }

# Pinned to match nixpkgs' `wasm-bindgen-cli` (see `just package-web`): the
# CLI's version must exactly match the `wasm-bindgen` crate baked into the
# .wasm, or it refuses to run. Not used directly by game code; this only
# constrains the version Cargo resolves for bevy's own wasm32 dependency.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"

[features]
# Faster iteration for local dev: dynamic-links Bevy (skip relinking the
# engine on every `cargo run`) and hot-reloads assets (sprites, audio,
# etc.) on file change. Not for release builds.
dev = [
	"bevy/dynamic_linking",
	"bevy/file_watcher",
]
